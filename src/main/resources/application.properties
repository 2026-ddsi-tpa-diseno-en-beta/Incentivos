# PostgreSQL

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Integraciones
donatrack.donaciones.url=https://donaciones-xouj.onrender.com
donatrack.donadores-y-entidades.url=https://entrega-2-lolasimone.onrender.com

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=false

# Server Configuration for Dockerfile
server.port=${PORT:8080}

# Datadog Configuration
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.step=${DATADOG_STEP:30s}

management.metrics.tags.application=incentivos
spring.application.name=incentivos

# Histograms permit p95/p99 queries instead of relying only on averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Entrega 6 - publicación de eventos para el modelo de lectura CQRS
spring.rabbitmq.addresses=${RABBITMQ_URL:}
donatrack.read-model.publisher.enabled=${READ_MODEL_PUBLISHER_ENABLED:false}
donatrack.read-model.exchange=${READ_MODEL_EXCHANGE:donatrack.readmodel.exchange}
donatrack.read-model.routing-key=${READ_MODEL_ROUTING_KEY:readmodel.changed}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

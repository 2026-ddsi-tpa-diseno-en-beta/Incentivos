# PostgreSQL

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Integraciones
donatrack.donaciones.url=https://donaciones-xouj.onrender.com
donatrack.donadores-y-entidades.url=https://entrega-2-lolasimone.onrender.com

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

# Server Configuration for Dockerfile
server.port=${PORT:8080}

# Datadog Configuration
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.uri=https://us5.datadoghq.com
management.datadog.metrics.export.api-key=${DATADOG_API_KEY}
management.datadog.metrics.export.step=30s

management.metrics.tags.application=incentivos